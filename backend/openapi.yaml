openapi: 3.0.3
info:
  title: Hotel Kong Arthur - Drift og booking API
  description: |
    REST API til booking og driftsanalyse. Bygget efter en 3-lags arkitektur
    med præsentationslag (REST), forretningslogiklag (tjenester) og datalag (SQLite).
    Hotellets nuværende booking system kan skrive (POST/PUT/DELETE) til dette API.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Lokal udvikling
  - url: http://backend:3000/api
    description: Docker internt netværk
tags:
  - name: bookings
    description: Administration af hotelbookinger
  - name: analytics
    description: Driftsnøgletal og gæstefeedback
  - name: bar
    description: Cocktail- og kaffebarsalg
paths:
  /bookings:
    get:
      tags: [bookings]
      summary: Hent alle bookinger
      operationId: getAllBookings
      responses:
        '200':
          description: En liste af bookinger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      tags: [bookings]
      summary: Opret en ny booking
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Booking oprettet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Valideringsfejl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Værelset er allerede booket i perioden
  /bookings/{id}:
    get:
      tags: [bookings]
      summary: Hent en booking efter id
      operationId: getBookingById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Booking ID
      responses:
        '200':
          description: Booking fundet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking ikke fundet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [bookings]
      summary: Opdater en booking
      operationId: updateBooking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Booking ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdate'
      responses:
        '200':
          description: Booking opdateret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Valideringsfejl
        '404':
          description: Booking ikke fundet
        '409':
          description: Værelset er allerede booket i perioden
    delete:
      tags: [bookings]
      summary: Slet en booking
      operationId: deleteBooking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Booking ID
      responses:
        '204':
          description: Booking slettet
        '404':
          description: Booking ikke fundet
  /analytics/overview:
    get:
      tags: [analytics]
      summary: Hent nøgletal for perioden
      operationId: getAnalyticsOverview
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: Første dato inklusive; standard er første dag i indeværende måned
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: Sidste dato inklusive; standard er sidste dag i indeværende måned. Intervallet må højst være 366 dage.
      responses:
        '200':
          description: Belægning, indtjening, feedback og barsalg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: Ugyldigt datointerval
  /analytics/occupancy:
    get:
      tags: [analytics]
      summary: Beregn belægning og antal bookinger
      operationId: getOccupancyAnalysis
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Værelsesnætter og belægningsgrad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyAnalysis'
        '400':
          description: Ugyldigt datointerval
  /analytics/revenue:
    get:
      tags: [analytics]
      summary: Beregn live værelsesindtægt og vis historisk sæsonomsætning
      operationId: getRevenueAnalysis
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Værelsesindtægt for perioden og historisk omsætning efter sæson/værelsestype
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueAnalysis'
        '400':
          description: Ugyldigt datointerval
  /analytics/satisfaction:
    get:
      tags: [analytics]
      summary: Beregn gæstetilfredshed og vurderingsfordeling
      operationId: getSatisfactionAnalysis
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Gennemsnit, antal svar og fordeling fra 1 til 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatisfactionAnalysis'
        '400':
          description: Ugyldigt datointerval
  /analytics/bar-sales:
    get:
      tags: [analytics, bar]
      summary: Beregn salgsmix og omsætning for cocktails og kaffe
      operationId: getBarSalesAnalysis
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Produktfordeling, enheder og omsætning for kategorien
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarSalesAnalysis'
        '400':
          description: Ugyldigt datointerval
  /bar-menu:
    get:
      tags: [bar]
      summary: Hent cocktail- og kaffemenu
      operationId: getBarMenu
      responses:
        '200':
          description: Menu med historiske grundtal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drink'
  /bar-sales:
    post:
      tags: [bar]
      summary: Registrer et nyt barsalg
      operationId: recordBarSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                staffMember:
                  type: string
                  default: Helene Christine
      responses:
        '201':
          description: Salg registreret
        '400':
          description: Ugyldigt salg
  /feedback:
    post:
      tags: [analytics]
      summary: Registrer gæstefeedback
      operationId: recordGuestFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                guestName:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Feedback registreret
        '400':
          description: Ugyldig feedback
components:
  parameters:
    FromDate:
      in: query
      name: from
      schema:
        type: string
        format: date
      description: Første dato inklusive; standard er første dag i indeværende måned
    ToDate:
      in: query
      name: to
      schema:
        type: string
        format: date
      description: Sidste dato inklusive; standard er sidste dag i indeværende måned. Intervallet må højst være 366 dage.
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        guestName:
          type: string
          example: "Jens Hansen"
        email:
          type: string
          example: "jens@example.com"
        roomNumber:
          type: integer
          example: 101
        nightlyRate:
          type: number
          format: float
          example: 1850
        checkIn:
          type: string
          format: date
          example: "2026-11-01"
        checkOut:
          type: string
          format: date
          example: "2026-11-05"
        status:
          type: string
          enum: [confirmed, cancelled, checked_in, checked_out]
          example: confirmed
        createdAt:
          type: string
          format: date-time
      required:
        - guestName
        - email
        - roomNumber
        - checkIn
        - checkOut
    BookingInput:
      type: object
      properties:
        guestName:
          type: string
        email:
          type: string
        roomNumber:
          type: integer
        nightlyRate:
          type: number
          format: float
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        status:
          type: string
          enum: [confirmed, cancelled, checked_in, checked_out]
      required:
        - guestName
        - email
        - roomNumber
        - checkIn
        - checkOut
    BookingUpdate:
      type: object
      description: Alle felter er valgfrie; mindst ét felt skal ændres.
      minProperties: 1
      properties:
        guestName:
          type: string
        email:
          type: string
          format: email
        roomNumber:
          type: integer
        nightlyRate:
          type: number
          format: float
          minimum: 0
          maximum: 99999999.99
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        status:
          type: string
          enum: [confirmed, cancelled, checked_in, checked_out]
    Error:
      type: object
      properties:
        error:
          type: string
      example:
        error: "Fejlbeskrivelse"
    Drink:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [Cocktail, Coffee]
        priceDkk:
          type: number
    AnalyticsOverview:
      type: object
      properties:
        period:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            days:
              type: integer
        occupancy:
          type: object
          properties:
            occupiedRoomNights:
              type: integer
            capacityRoomNights:
              type: integer
            totalRooms:
              type: integer
            ratePercent:
              type: number
        bookings:
          type: integer
        roomRevenueDkk:
          type: number
        feedback:
          type: object
          properties:
            count:
              type: integer
            averageRating:
              type: number
              nullable: true
            ratings:
              type: array
              items:
                type: object
                properties:
                  rating:
                    type: integer
                  count:
                    type: integer
        historical:
          type: object
          properties:
            sourceDescription:
              type: string
            totalStays:
              type: integer
            totalRevenueDkk:
              type: number
            seasons:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  stays:
                    type: integer
                  revenueDkk:
                    type: number
                  averageStayRevenueDkk:
                    type: number
            roomTypes:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  stays:
                    type: integer
                  revenueDkk:
                    type: number
        bar:
          type: object
          properties:
            baselineDescription:
              type: string
            liveSalesDescription:
              type: string
            categories:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  totalUnits:
                    type: integer
                  totalRevenueDkk:
                    type: number
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        units:
                          type: integer
                        revenueDkk:
                          type: number
                        baselineUnits:
                          type: integer
                        liveUnits:
                          type: integer
                        heleneUnits:
                          type: integer
                        sharePercent:
                          type: number
                        heleneSharePercent:
                          type: number
    OccupancyAnalysis:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        occupancy:
          type: object
          properties:
            occupiedRoomNights:
              type: integer
            capacityRoomNights:
              type: integer
            totalRooms:
              type: integer
            ratePercent:
              type: number
        bookings:
          type: integer
    RevenueAnalysis:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        roomRevenueDkk:
          type: number
        historical:
          $ref: '#/components/schemas/HistoricalAnalysis'
    SatisfactionAnalysis:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        feedback:
          $ref: '#/components/schemas/FeedbackSummary'
    BarSalesAnalysis:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        bar:
          $ref: '#/components/schemas/BarAnalysis'
    AnalyticsPeriod:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
    HistoricalAnalysis:
      type: object
      properties:
        sourceDescription:
          type: string
        totalStays:
          type: integer
        totalRevenueDkk:
          type: number
        seasons:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum: [low, mid, high]
              stays:
                type: integer
              revenueDkk:
                type: number
              averageStayRevenueDkk:
                type: number
        roomTypes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              stays:
                type: integer
              revenueDkk:
                type: number
    FeedbackSummary:
      type: object
      properties:
        count:
          type: integer
        averageRating:
          type: number
          nullable: true
        ratings:
          type: array
          items:
            type: object
            properties:
              rating:
                type: integer
              count:
                type: integer
    BarAnalysis:
      type: object
      properties:
        baselineDescription:
          type: string
        liveSalesDescription:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BarCategory'
    BarCategory:
      type: object
      properties:
        name:
          type: string
          enum: [Cocktail, Coffee]
        totalUnits:
          type: integer
        totalRevenueDkk:
          type: number
        products:
          type: array
          items:
            $ref: '#/components/schemas/BarProduct'
    BarProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        units:
          type: integer
        revenueDkk:
          type: number
        baselineUnits:
          type: integer
        liveUnits:
          type: integer
        heleneUnits:
          type: integer
        sharePercent:
          type: number
        heleneSharePercent:
          type: number
