server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker-DNS slår backend op ved hvert kald, så Nginx kan starte før backenden.
  resolver 127.0.0.11 valid=10s;

  location = /nginx.conf {
    return 404;
  }

  location /api {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    # Ingen caching: en ændring skal kunne ses i næste GET (C-01).
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store";
  }
}
