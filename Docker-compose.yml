services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      SQLITE_DATABASE: /app/data/hotel.sqlite
    volumes:
      - sqlite_data:/app/data
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  sqlite_data:
